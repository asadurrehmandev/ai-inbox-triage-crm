services:
  triage-api:
    build: .
    ports:
      - "8741:8741"
    env_file:
      - .env.example
    environment:
      DATABASE_PATH: /data/triage.db
      WORKER_ENABLED: "true"
      WORKER_INTERVAL_SECONDS: "60"
    volumes:
      - triage-data:/data

  dashboard:
    build: ./dashboard
    ports:
      - "8742:8742"
    depends_on:
      - triage-api

volumes:
  triage-data:
