services:
  triage-api:
    build: .
    ports:
      - "8741:8741"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /data/triage.db
      WORKER_ENABLED: "true"
      WORKER_INTERVAL_SECONDS: "60"
      API_TOKEN: ${API_TOKEN:-lane-demo-token}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-lane-demo-webhook}
      DEMO_MODE: ${DEMO_MODE:-true}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      CORS_ORIGINS: http://127.0.0.1:8742,http://localhost:8742
    volumes:
      - triage-data:/data

  dashboard:
    build:
      context: ./dashboard
      args:
        NEXT_PUBLIC_API_BASE: http://127.0.0.1:8741/api
        NEXT_PUBLIC_API_TOKEN: ${API_TOKEN:-lane-demo-token}
    ports:
      - "8742:8742"
    depends_on:
      - triage-api

volumes:
  triage-data:
